site_name: AA Engineering Toolkit
site_url: https://areebahmed401.github.io/aa-engineering-toolkit/docs/
site_description: Thermodynamics, structural, electrical and ASME calculations as a Python package and a browser app.
repo_url: https://github.com/areebahmed401/aa-engineering-toolkit
repo_name: areebahmed401/aa-engineering-toolkit
edit_uri: ""

theme:
  name: material
  logo: assets/aa-logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            members_order: source
            show_root_heading: true
            heading_level: 2
            merge_init_into_class: true
            separate_signature: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
      base_path: ["."]
  - toc:
      permalink: true
  - attr_list
  - tables

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - How-to:
      - Add a tool: how-to/add-a-tool.md
      - Add a material: how-to/add-a-material.md
      - Add a discipline: how-to/add-a-discipline.md
  - API reference:
      - Core: reference/core.md
      - Materials: reference/materials.md
      - Catalogs: reference/catalogs.md
      - Thermo: reference/thermo.md
      - Structural: reference/structural.md
      - Electrical: reference/electrical.md
      - ASME: reference/asme.md
  - Changelog: changelog.md
  - Web app: https://areebahmed401.github.io/aa-engineering-toolkit/
