name: Tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Unit tests
        run: pytest

      - name: Notebooks run top to bottom
        run: pytest --nbmake --nbmake-timeout=300 "0. overview.ipynb" "1. Structural" "2. Fluids" "3. ASME"
