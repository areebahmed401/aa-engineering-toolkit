# Thermal insulation. Conductivity rises with mean temperature, so k is given as a curve.
# Typical manufacturer data for preliminary sizing; use the product datasheet for design.
materials:
  - name: Mineral wool
    family: insulation
    aliases: [Rock wool, Stone wool, Mineral wool pipe section]
    source: Typical pipe-section data (approx. 100-120 kg/m3), e.g. EN ISO 12241 practice
    mechanical: {rho: 110}
    thermal:
      k: {T_C: [10, 50, 100, 200, 300], value: [0.035, 0.039, 0.044, 0.058, 0.078]}
      cp: 840
      max_service_T_C: 650

  - name: Fiberglass
    family: insulation
    aliases: [Glass wool, Fibreglass]
    source: Typical glass wool pipe section data (approx. 48-64 kg/m3)
    mechanical: {rho: 56}
    thermal:
      k: {T_C: [10, 50, 100, 200], value: [0.033, 0.038, 0.045, 0.063]}
      cp: 840
      max_service_T_C: 450

  - name: Calcium silicate
    family: insulation
    aliases: [Cal-sil]
    source: Typical calcium silicate block data (approx. 240 kg/m3)
    mechanical: {rho: 240}
    thermal:
      k: {T_C: [50, 100, 200, 300, 400], value: [0.055, 0.058, 0.065, 0.072, 0.080]}
      cp: 900
      max_service_T_C: 650

  - name: Polyurethane foam
    family: insulation
    aliases: [PUR, PU foam]
    source: Typical rigid PUR foam data (approx. 40 kg/m3)
    mechanical: {rho: 40}
    thermal:
      k: {T_C: [-20, 10, 50, 100], value: [0.022, 0.024, 0.027, 0.031]}
      cp: 1400
      max_service_T_C: 120

  - name: Aluminium cladding
    family: cladding
    aliases: [Aluminum jacketing]
    source: Typical aluminium jacketing (weathered); emissivity governs outer heat loss
    mechanical: {rho: 2700}
    thermal: {k: 200, cp: 900, emissivity: 0.1}
