# Battery cells for engtoolkit.catalogs.cells.
# ocv_table rows: [SOC (0-1), OCV (V), entropic coefficient dU/dT (mV/K)] at 25 °C; SOC 0 is where the
# OCV reaches the discharge cut-off V_min.
# ecm: Thevenin model V = OCV - I*R0 - V1 - V2, each RC pair dV/dt = I/C - V/(R*C) with tau = R*C;
#      resistances scale with exp(Ea/R_gas * (1/T - 1/T_ref)).
# aging_model: correlation in engtoolkit.electrical.battery.aging (wang2011_lfp / schmalstieg2014_nmc).
# Values are representative of each cell for estimation and learning; check a datasheet before design.

cells:
  - name: LG M50 21700 (NMC811)
    chemistry: NMC811 / graphite-SiOx
    format: cylindrical
    capacity_Ah: 5.0
    V_nominal: 3.63
    V_max: 4.2
    V_min: 2.5
    mass_g: 68.0
    cp: 1100
    dimensions_mm: [21.1, 70.3]
    max_discharge_C: 1.5
    max_charge_C: 0.7
    aging_model: schmalstieg2014_nmc
    source: >-
      LG Chem INR21700-M50 datasheet (capacity, voltages, mass, size); OCV from the Chen et al. (2020)
      electrode OCP functions (PyBaMM "Chen2020" set, J. Electrochem. Soc. 167, 080534); 2RC parameters
      fitted to PyBaMM DFN 1C pulses at 60 % SOC with the same set, Ea from the 10-40 °C fits
      (scripts/generate_battery_reference.py);
      dU/dT typical of NMC/graphite (Viswanathan et al. 2010, J. Power Sources 195, 3720)
    ecm: {R0_mohm: 23.38, R1_mohm: 3.70, tau1_s: 11.3, R2_mohm: 19.11, tau2_s: 86.1, Ea_kJ_mol: 13.7, T_ref: 298.15}
    ocv_table:
      - [0.000, 2.5000, 0.300]
      - [0.010, 2.7114, 0.280]
      - [0.020, 2.8625, 0.260]
      - [0.030, 2.9712, 0.240]
      - [0.050, 3.1094, 0.200]
      - [0.075, 3.2107, 0.125]
      - [0.100, 3.2959, 0.050]
      - [0.150, 3.4339, -0.025]
      - [0.200, 3.4852, -0.100]
      - [0.250, 3.5286, -0.125]
      - [0.300, 3.5814, -0.150]
      - [0.350, 3.6290, -0.125]
      - [0.400, 3.6670, -0.100]
      - [0.450, 3.7054, -0.075]
      - [0.500, 3.7509, -0.050]
      - [0.550, 3.7983, -0.025]
      - [0.600, 3.8406, 0.000]
      - [0.650, 3.8896, 0.010]
      - [0.700, 3.9479, 0.020]
      - [0.750, 3.9943, 0.020]
      - [0.800, 4.0421, 0.020]
      - [0.850, 4.0809, 0.000]
      - [0.900, 4.0967, -0.020]
      - [0.950, 4.1236, -0.050]
      - [0.980, 4.1645, -0.068]
      - [1.000, 4.2000, -0.080]

  - name: A123 ANR26650M1B (LFP)
    chemistry: LFP / graphite
    format: cylindrical
    capacity_Ah: 2.5
    V_nominal: 3.3
    V_max: 3.6
    V_min: 2.0
    mass_g: 76.0
    cp: 1100
    dimensions_mm: [26.0, 65.0]
    max_discharge_C: 20.0
    max_charge_C: 4.0
    aging_model: wang2011_lfp
    source: >-
      A123 Systems ANR26650M1B datasheet (2.5 Ah, 3.3 V, 76 g, 26 x 65 mm, 6 mohm AC impedance);
      OCV and dU/dT typical of LFP/graphite (Prada et al. 2013, J. Electrochem. Soc. 160, A616;
      Forgez et al. 2010, J. Power Sources 195, 2961); 2RC values representative of published HPPC tests
    ecm: {R0_mohm: 10.0, R1_mohm: 4.0, tau1_s: 10.0, R2_mohm: 5.0, tau2_s: 200.0, Ea_kJ_mol: 30.0, T_ref: 298.15}
    ocv_table:
      - [0.00, 2.000, 0.10]
      - [0.02, 2.900, 0.08]
      - [0.05, 3.150, 0.05]
      - [0.10, 3.220, 0.00]
      - [0.20, 3.260, -0.05]
      - [0.30, 3.285, -0.05]
      - [0.40, 3.295, 0.00]
      - [0.50, 3.300, 0.00]
